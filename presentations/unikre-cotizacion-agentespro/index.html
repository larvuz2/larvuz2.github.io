<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cotización UnikRe × agentesPRO</title>
  <meta name="description" content="Preview de cotización: Empleados Digitales para UnikRe." />
  <style>
    :root{--bg:#e9e9e9;--paper:#fff;--ink:#080808;--muted:#666;--line:#d8d8d8;}
    *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif;overflow:hidden}
    .top{position:fixed;left:0;right:0;top:0;height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:16px}
    .brand{font-weight:800;letter-spacing:-.02em}.meta{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid #111;border-radius:999px;color:#111;text-decoration:none;padding:9px 14px;font-size:13px;background:#fff}.btn.primary{background:#111;color:#fff}.counter{font-size:13px;color:#555;min-width:58px;text-align:center}
    .stage{position:fixed;inset:64px 0 0;display:flex;align-items:center;justify-content:center;padding:26px}.slide-wrap{position:relative;width:min(92vw, calc((100vh - 132px)*16/9));aspect-ratio:16/9;background:#fff;box-shadow:0 22px 80px rgba(0,0,0,.18)}
    .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .22s ease;pointer-events:none}.slide.active{opacity:1;pointer-events:auto}
    .nav{position:fixed;inset:64px 0 0;pointer-events:none}.arrow{pointer-events:auto;position:absolute;top:50%;transform:translateY(-50%);width:48px;height:76px;border:0;background:rgba(255,255,255,.86);border-radius:999px;font-size:36px;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.10)}.prev{left:18px}.next{right:18px}
    .hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#777;font-size:12px}
    @media(max-width:760px){.top{height:auto;min-height:76px;flex-wrap:wrap;padding:10px 14px}.stage{inset:86px 0 0;padding:10px}.actions{gap:6px}.btn{padding:8px 10px}.arrow{width:42px;height:60px}.hint{display:none}}
  </style>
</head>
<body>
  <header class="top">
    <div><div class="brand">Cotización UnikRe × agentesPRO</div><div class="meta">Empleados Digitales para operación de reaseguro</div></div>
    <div class="actions"><a class="btn" href="downloads/Cotizacion_UnikRe_agentesPRO.pdf" target="_blank">PDF</a><a class="btn" href="downloads/Cotizacion_UnikRe_agentesPRO.pptx">PPTX</a><span class="counter" id="counter">1 / 10</span><a class="btn primary" href="downloads/Cotizacion_UnikRe_agentesPRO.pdf" target="_blank">Abrir</a></div>
  </header>
  <main class="stage"><div class="slide-wrap" id="deck">
    <img class="slide active" src="slides/slide_01.png" alt="Slide 1" />
    <img class="slide" src="slides/slide_02.png" alt="Slide 2" />
    <img class="slide" src="slides/slide_03.png" alt="Slide 3" />
    <img class="slide" src="slides/slide_04.png" alt="Slide 4" />
    <img class="slide" src="slides/slide_05.png" alt="Slide 5" />
    <img class="slide" src="slides/slide_06.png" alt="Slide 6" />
    <img class="slide" src="slides/slide_07.png" alt="Slide 7" />
    <img class="slide" src="slides/slide_08.png" alt="Slide 8" />
    <img class="slide" src="slides/slide_09.png" alt="Slide 9" />
    <img class="slide" src="slides/slide_10.png" alt="Slide 10" />
  </div></main>
  <div class="nav"><button class="arrow prev" onclick="go(-1)" aria-label="Anterior">‹</button><button class="arrow next" onclick="go(1)" aria-label="Siguiente">›</button></div>
  <div class="hint">Usa ← → o espacio para navegar</div>
  <script>
    const slides=[...document.querySelectorAll('.slide')]; let idx=0; const counter=document.getElementById('counter');
    function render(){slides.forEach((s,i)=>s.classList.toggle('active',i===idx)); counter.textContent=(idx+1)+' / '+slides.length; location.hash='slide-'+(idx+1)}
    function go(n){idx=(idx+n+slides.length)%slides.length; render()}
    document.addEventListener('keydown',e=>{if(['ArrowRight',' '].includes(e.key))go(1); if(e.key==='ArrowLeft')go(-1)})
    const m=location.hash.match(/slide-(\d+)/); if(m){idx=Math.max(0,Math.min(slides.length-1,parseInt(m[1])-1)); render()}
  </script>
</body>
</html>
