<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Larvuz Presentations</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0b0c; --fg:#f4f0e8; --muted:#a69a8e; --line:rgba(244,240,232,.16); --accent:#f2b6c6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 20% 10%, rgba(242,182,198,.16), transparent 34%), var(--bg); color:var(--fg); display:grid; place-items:center; padding:56px; }
    main { width:min(980px,100%); }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.22em; font-size:12px; }
    h1 { font-size:clamp(44px,8vw,92px); line-height:.9; letter-spacing:-.07em; margin:18px 0 28px; }
    p { color:var(--muted); font-size:18px; line-height:1.55; max-width:660px; }
    a.card { display:block; margin-top:34px; padding:26px; border:1px solid var(--line); border-radius:26px; text-decoration:none; color:var(--fg); background:rgba(255,255,255,.035); transition:transform .35s ease, border-color .35s ease, background .35s ease; }
    a.card:hover { transform:translateY(-3px); border-color:rgba(242,182,198,.45); background:rgba(255,255,255,.055); }
    .label { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.16em; }
    .title { font-size:30px; margin-top:8px; letter-spacing:-.03em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Larvuz / Shared Deck Index</div>
    <h1>Presentations</h1>
    <p>One shared GitHub Pages home for browser-first HTML decks, with PDFs and videos exported only when needed.</p>
    <a class="card" href="./gus-sakura-chroma/">
      <div class="label">Live deck</div>
      <div class="title">Gus Sakura Chroma</div>
    </a>
  </main>
</body>
</html>
